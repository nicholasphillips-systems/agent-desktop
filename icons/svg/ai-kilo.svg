<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1810"/>
      <stop offset="100%" stop-color="#180C08"/>
    </linearGradient>
    <linearGradient id="kiloOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#F97316" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Modern Geometric 'K' -->
    <path d="M -22,-30 L -22,30" stroke="url(#kiloOrange)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 22,-28 L -14,0 L 22,28" stroke="url(#kiloOrange)" stroke-width="9" stroke-linecap="round" stroke-linejoin="miter"/>
    <circle cx="-14" cy="0" r="5" fill="#FFF"/>
  </g>
</svg>