<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241432"/>
      <stop offset="100%" stop-color="#120A1A"/>
    </linearGradient>
    <linearGradient id="qwenPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#A855F7" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Hexagonal Qwen shape -->
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="none" stroke="url(#qwenPurple)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="12" fill="url(#qwenPurple)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <path d="M 12,12 L 26,26" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>