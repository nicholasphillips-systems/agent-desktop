<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="antiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Floating Antigravity Rings & Triangle -->
    <ellipse cx="0" cy="18" rx="32" ry="10" fill="none" stroke="url(#antiGrad)" stroke-width="4"/>
    <polygon points="0,-32 24,10 -24,10" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="-4" r="6" fill="url(#antiGrad)"/>
  </g>
</svg>