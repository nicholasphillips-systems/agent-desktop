<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="clineBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Robot head & visor -->
    <rect x="-30" y="-24" width="60" height="48" rx="16" fill="none" stroke="url(#clineBlue)" stroke-width="6"/>
    <rect x="-20" y="-10" width="40" height="14" rx="6" fill="#93C5FD"/>
    <circle cx="0" cy="-30" r="4" fill="url(#clineBlue)"/>
    <line x1="0" y1="-24" x2="0" y2="-26" stroke="url(#clineBlue)" stroke-width="4"/>
  </g>
</svg>