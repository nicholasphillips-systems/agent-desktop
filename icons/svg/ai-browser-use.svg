<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E242B"/>
      <stop offset="100%" stop-color="#071216"/>
    </linearGradient>
    <linearGradient id="browserCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Browser Window Frame -->
    <rect x="-32" y="-24" width="64" height="48" rx="8" fill="none" stroke="url(#browserCyan)" stroke-width="5"/>
    <line x1="-32" y1="-12" x2="32" y2="-12" stroke="url(#browserCyan)" stroke-width="3"/>
    <circle cx="-24" cy="-18" r="2" fill="#2DD4BF"/>
    <circle cx="-16" cy="-18" r="2" fill="#2DD4BF"/>
    <!-- Agent Pointer -->
    <polygon points="6,0 24,18 16,19 12,28 6,25 10,18" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  </g>
</svg>