  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#E08B6E" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Anthropic Claude Sparkle Star -->
    <path d="M 0,-40 C 3,-15 15,-3 40,0 C 15,3 3,15 0,40 C -3,15 -15,3 -40,0 C -15,-3 -3,-15 0,-40 Z" fill="url(#sparkle)"/>
    <path d="M 0,-28 C 2,-10 10,-2 28,0 C 10,2 2,10 0,28 C -2,10 -10,2 -28,0 C -10,-2 -2,-10 0,-28 Z" fill="#FFF" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
