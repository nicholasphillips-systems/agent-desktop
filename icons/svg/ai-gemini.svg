<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E95ED"/>
      <stop offset="50%" stop-color="#9969F6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#4E95ED" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Gemini 4-point curved star -->
    <path d="M 0,-44 C 4,-18 18,-4 44,0 C 18,4 4,18 0,44 C -4,18 -18,4 -44,0 C -18,-4 -4,-18 0,-44 Z" fill="url(#geminiGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <circle cx="20" cy="-20" r="2.5" fill="#00E5FF" opacity="0.8"/>
  </g>
</svg>