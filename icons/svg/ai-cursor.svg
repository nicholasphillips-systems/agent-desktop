<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="cursorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Isometric Cube / Cursor Logo -->
    <polygon points="0,-32 28,-16 0,0 -28,-16" fill="#93C5FD"/>
    <polygon points="-28,-16 0,0 0,32 -28,16" fill="#3B82F6"/>
    <polygon points="0,0 28,-16 28,16 0,32" fill="#1D4ED8"/>
    <!-- Cursor arrow -->
    <path d="M 2,2 L 18,18 L 10,20 L 6,28 Z" fill="#FFFFFF"/>
  </g>
</svg>