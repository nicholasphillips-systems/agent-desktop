<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13261C"/>
      <stop offset="100%" stop-color="#0A150F"/>
    </linearGradient>
    <linearGradient id="devinGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#10B981" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Devin Terminal Box -->
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="none" stroke="url(#devinGreen)" stroke-width="6"/>
    <!-- Terminal prompt and cursor block -->
    <path d="M -18,-10 L -6,0 L -18,10" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="2" y="-6" width="16" height="14" rx="2" fill="url(#devinGreen)"/>
  </g>
</svg>