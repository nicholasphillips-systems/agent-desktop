<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1433"/>
      <stop offset="100%" stop-color="#0D091B"/>
    </linearGradient>
    <linearGradient id="oracleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- Eye of Oracle / Local Sphere -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#oracleGlow)" stroke-width="4"/>
    <path d="M -34,0 C -20,-20 20,-20 34,0 C 20,20 -20,20 -34,0 Z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="url(#oracleGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="-24" r="2" fill="#A78BFA"/>
    <circle cx="0" cy="24" r="2" fill="#A78BFA"/>
  </g>
</svg>